<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Exam Submission Monitoring{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --sidebar-width: 220px; }
        html, body { max-width: 100%; overflow-x: hidden; }
        .dashboard-shell { min-height: 100vh; }
        .sidebar { position: fixed; inset: 0 auto 0 0; width: var(--sidebar-width); box-sizing: border-box; z-index: 1000; overflow-y: auto; background: #0b5ed7; color: #fff; }
        .sidebar .navbar-brand { max-width: 100%; white-space: normal; overflow-wrap: anywhere; font-size: 1.05rem; line-height: 1.25; }
        .sidebar .nav-link { color: rgba(255,255,255,.82); border-radius: .375rem; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { color: #fff; background: rgba(255,255,255,.16); }
        .main-content { position: relative; z-index: 1; width: calc(100% - var(--sidebar-width)); margin-left: var(--sidebar-width); min-width: 0; box-sizing: border-box; }
        .sidebar-footer { position: absolute; bottom: 1.5rem; left: 1.5rem; right: 1.5rem; }
        .table { width: 100%; table-layout: fixed; }
        .table th { white-space: normal; }
        .table td, .table th { overflow-wrap: anywhere; }
        .table-responsive { overflow-x: hidden; }
        @media (max-width: 991.98px) {
            .sidebar { position: static; width: auto; min-height: auto; }
            .main-content { width: 100%; margin-left: 0; }
            .sidebar-footer { position: static; margin-top: 1.5rem; }
        }
        @media (max-width: 767.98px) {
            .main-content { padding-left: 1rem !important; padding-right: 1rem !important; }
            .card-body { padding: 1rem; }
            .status-table thead { display: none; }
            .status-table, .status-table tbody, .status-table tr, .status-table td { display: block; width: 100%; }
            .status-table tr { padding: .85rem 0; border-bottom: 1px solid #dee2e6; }
            .status-table tr:last-child { border-bottom: 0; }
            .status-table td { display: flex; justify-content: space-between; gap: 1rem; border: 0; padding: .3rem 0; text-align: right !important; }
            .status-table td::before { content: attr(data-label); color: #6c757d; font-weight: 600; text-align: left; flex: 0 0 42%; }
            .status-table td > * { max-width: 58%; }
        }
        @media print {
            @page { margin: 1.2cm; }
            html, body { background: #fff !important; overflow: visible; }
            .sidebar, .report-filters, .report-actions, .pagination { display: none !important; }
            .main-content { width: 100%; margin: 0; padding: 0 !important; }
            .card { border: 1px solid #dee2e6 !important; box-shadow: none !important; }
            .report-header { display: block !important; }
            .report-header h1 { margin-bottom: .25rem; }
            a { color: #000; text-decoration: none; }
            .table-responsive { overflow: visible !important; }
            .table { table-layout: auto; }
        }
    </style>
</head>
<body class="bg-light">
<div class="dashboard-shell">
    <aside class="sidebar p-4">
        <a class="navbar-brand d-block mb-4" href="{% url 'monitoring:dashboard' %}">Exam Submission Monitoring</a>
        <p class="text-uppercase small fw-semibold mb-2 opacity-75">Monitoring</p>
        <nav class="nav nav-pills flex-column gap-1">
            <a class="nav-link {% if active_nav == 'dashboard' %}active{% endif %}" href="{% url 'monitoring:dashboard' %}">Dashboard</a>
            <a class="nav-link {% if active_nav == 'sites' %}active{% endif %}" href="{% url 'monitoring:sites' %}">Districts / Sites</a>
            <a class="nav-link {% if active_nav == 'reports' %}active{% endif %}" href="{% url 'monitoring:reports' %}">Reports</a>
        </nav>
        <div class="sidebar-footer">
            <div class="small opacity-75 mb-2">{{ request.user.get_full_name|default:request.user.email }}</div>
            <form method="post" action="{% url 'accounts:logout' %}">{% csrf_token %}<button class="btn btn-outline-light btn-sm w-100" type="submit">Log out</button></form>
        </div>
    </aside>
    <main class="main-content container-fluid px-4 py-4">
            {% block content %}{% endblock %}
    </main>
</div>
</body>
</html>
