<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Staff login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5" style="max-width: 480px">
    <div class="card border-0 shadow-sm"><div class="card-body p-4">
        <h1 class="h3 mb-4">Staff login</h1>
        <form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn btn-primary w-100" type="submit">Log in</button></form>
        <p class="mt-3 mb-0 text-center">New staff member? <a href="{% url 'accounts:signup' %}">Create an account</a></p>
    </div></div>
</main>
</body>
</html>
